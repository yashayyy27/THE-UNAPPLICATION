name: Publish GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      NEXT_PUBLIC_BASE_PATH: /THE-UNAPPLICATION
      NEXT_PUBLIC_SITE_RELEASE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/export-content.mjs && git diff --exit-code -- public/scenario.json public/evidence-manifest.json docs/EVIDENCE-MANIFEST.md public/scenes.css app/artwork.css
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages
      - run: npm audit --omit=dev
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved static export
        id: deployment
        uses: actions/deploy-pages@v4
